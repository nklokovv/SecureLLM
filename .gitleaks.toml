title = "SecureLLM gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["key", "openai"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[A-Za-z0-9-]{20,}'''
tags = ["key", "anthropic"]

[allowlist]
paths = [
  '''\.env\.example$''',
  '''test/''',
  '''README\.md$''',
]
